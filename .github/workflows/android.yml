name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Build APK
      run: |
        # ১. সব জিপ ফাইল আনজিপ করা
        unzip -o sojib-ai.zip
        
        # ২. gradlew ফাইলটি খুঁজে বের করে সেই ফোল্ডারে যাওয়া
        GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_FILE")
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        
        # ৩. প্রজেক্টের ভেতর থেকেই APK বিল্ড করা
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
